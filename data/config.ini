[MultiCopy]
; Séparateur entre les éléments copiés
Separator=\n

; Encodage des fichiers d'archive
Encoding=UTF-8

; Format du nom de fichier d'archive
ArchiveNameFormat=YYYY-MM-DD_HH-MM-SS

[Viewer]
; Nombre de lignes à afficher par archive dans la liste
PreviewLines=5

[Hotkeys]
; Raccourcis globaux (format: Modifier+Key)
CopyHotkey=^!c
CutHotkey=^!x
PasteHotkey=^!v
ViewerHotkey=^!b
